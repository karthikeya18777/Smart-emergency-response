<!DOCTYPE html>
<html>
<head>
    <title>Control Room - Live Rescue</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { margin: 0; display: flex; font-family: Arial; height: 100vh; }
        #sidebar { width: 300px; background: #2c3e50; color: white; padding: 15px; overflow-y: scroll; }
        #map { flex-grow: 1; }
        .alert-box { background: #e74c3c; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        img { width: 100%; border-radius: 5px; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Live Emergencies 🚨</h2>
        <div id="alerts">Waiting for SOS...</div>
    </div>
    
    <div id="map"></div>

    <script>
        // Render ke secure connection (HTTPS) ke liye socket setup
        const socket = io({ transports: ['websocket', 'polling'] });
        
        const map = L.map('map').setView([15.8497, 74.4977], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const hospitalLocation = [15.8600, 74.5000];
        // Ambulance ka marker alag se banaya taaki ise move kar sakein
        let ambulanceMarker = L.marker(hospitalLocation).addTo(map).bindPopup("🏥 Ambulance Base").openPopup();
        let routeControl = null;

        socket.on('receive_sos', function(data) {
            document.getElementById('alerts').innerHTML = ""; 
            
            const victimLocation = L.latLng(data.lat, data.lng);
            L.marker(victimLocation).addTo(map).bindPopup("🚨 ACCIDENT HERE").openPopup();

            if(routeControl) { map.removeControl(routeControl); }

            // Route nikalne ke liye HTTPS server ka use karna zaroori hai (Error fix)
            routeControl = L.Routing.control({
                waypoints: [ L.latLng(hospitalLocation), victimLocation ],
                router: L.Routing.osrmv1({
                    serviceUrl: 'https://router.project-osrm.org/route/v1'
                }),
                routeWhileDragging: false,
                lineOptions: { styles: [{color: 'blue', weight: 6}] }
            }).addTo(map);

            // LIVE TRACKING SIMULATION: Ambulance ko route par chalana
            routeControl.on('routesfound', function(e) {
                const routes = e.routes;
                const coordinates = routes[0].coordinates; // Pura rasta (array of lat,lng)
                let i = 0;
                
                // Har 300 millisecond mein ambulance thoda aage badhegi
                const interval = setInterval(() => {
                    if(i < coordinates.length) {
                        ambulanceMarker.setLatLng([coordinates[i].lat, coordinates[i].lng]);
                        i++;
                    } else {
                        clearInterval(interval);
                        ambulanceMarker.bindPopup("🚑 Ambulance Reached!").openPopup();
                    }
                }, 300); 
            });

            let alertHTML = `
                <div class="alert-box">
                    <h3>⚠️ New Emergency</h3>
                    <p>Lat: ${data.lat.toFixed(4)}<br>Lng: ${data.lng.toFixed(4)}</p>
                    ${data.photo ? `<img src="${data.photo}">` : '<p>No Photo Provided</p>'}
                </div>
            `;
            document.getElementById('alerts').insertAdjacentHTML('afterbegin', alertHTML);
            map.setView(victimLocation, 14);
        });
    </script>
</body>
</html>
